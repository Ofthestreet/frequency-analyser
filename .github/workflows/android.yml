name: Tests et APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Tests et APK de debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tests unitaires (traitement du signal)
        run: gradle --no-daemon testDebugUnitTest

      - name: Construire l'APK de debug
        run: gradle --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: frequency-analyser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier la release et son APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk frequency-analyser.apk
          gh release create "$GITHUB_REF_NAME" frequency-analyser.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "Téléchargez **frequency-analyser.apk** ci-dessous, ouvrez-le sur le téléphone et autorisez l'installation depuis cette source. Les étapes détaillées sont dans le README."

      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-gradle
          path: app/build/reports/
          if-no-files-found: ignore
